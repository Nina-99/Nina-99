name: Update GitHub Profile Metrics

on:
  workflow_dispatch:

  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest

    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Requires a Personal Access Token: GITHUB_TOKEN is repo-scoped
          # and cannot read user-level data (languages, activity events).
          token: ${{ secrets.METRICS_TOKEN }}
          template: classic
          filename: metrics.svg
          base: header
          config_order: base.header, isocalendar, languages, lines
          config_timezone: America/La_Paz

          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used

          # The habits plugin is broken upstream: GitHub's events API no
          # longer returns `commits` in PushEvent payloads, so habits
          # crashes with "Cannot destructure property 'author'".
          plugin_lines: yes
          plugin_lines_sections: history
          plugin_lines_history_limit: 1
