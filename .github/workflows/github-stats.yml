name: Update GitHub Profile Metrics

on:
  workflow_dispatch:

  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest

    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Requires a Personal Access Token: GITHUB_TOKEN is repo-scoped
          # and cannot read user-level data (languages, activity events).
          token: ${{ secrets.METRICS_TOKEN }}
          template: classic
          filename: metrics.svg
          base: header
          config_order: base.header, isocalendar, languages
          config_timezone: America/La_Paz
          extras_css: |
            svg { font-size: 18px !important; }
            h1 { font-size: 24px !important; }
            h2 { font-size: 20px !important; }
            h3 { font-size: 18px !important; }

          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
